<!DOCTYPE HTML>
<html>
<head>
    <title>Trivia Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="{{ url_for('static', filename='triviastyle.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.4/socket.io.js" integrity="sha512-aMGMvNYu8Ue4G+fHa359jcPb1u+ytAF+P2SCb+PxrjCdO3n3ZTxJ30zuH39rimUggmTwmh2u7wvQsDTHESnmfQ==" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">

        /* Cookie utilities */
        function setCookie(name,value,days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days*24*60*60*1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "")  + expires + "; path=/";
        }
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for(var i=0;i < ca.length;i++) {
                var c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }
        function eraseCookie(name) {   
            document.cookie = name +'=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }

        /* Dark mode theme management */
        function initTheme() {
            var savedTheme = getCookie('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme || (prefersDark ? 'dark' : 'light');
            applyTheme(theme);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                setCookie('theme', 'dark', 365);
            } else {
                document.documentElement.classList.remove('dark');
                setCookie('theme', 'light', 365);
            }
            updateThemeButton();
        }

        function toggleTheme() {
            var isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
        }

        function updateThemeButton() {
            var isDark = document.documentElement.classList.contains('dark');
            var btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
            }
        }

        $(document).ready(function() {
            // Initialize theme from cookie or system preference
            initTheme();

            // Connect to the Socket.IO server.
            // The connection URL has the following format, relative to the current page:
            //     http[s]://<domain>:<port>[/<namespace>]
            var socket = io({
                reconnection: true,
                reconnectionDelay: 500,
                reconnectionDelayMax: 3000,
                reconnectionAttempts: 10,
                transports: ['websocket', 'polling']
            });
            //var socket = io('http://192.168.1.140:5500');
            //var socket = io('https://triviaweb.deta.dev:5000');
            //var socket = io('127.0.0.1:5500');

            var username = getCookie("username");
            var room = getCookie("room");
            var isHost = false;
            
            // Hide the change room button when loading:
            $("#change_room_menu").hide();
            

            if(room != null){
                $('#join_room').attr("value", room);
                $('#start_room_button').attr("value", room);
                $('#log').append('<br>room: ' + room);

            }
            if(username != null){
                $('#username').attr("value", username);
                $('#log').append('<br>username: ' + username);
            }
            

            // $(".menubar").hide();
            // $(".menubar").show();

            $('.menu-toggler').click(function() {
                $("#menu").toggle();
            });
            $('.room_menu-toggler').click(function() {
                // $("#room_menu").toggle();
                // $("#room_menu-button").toggle();
            });

            // Theme toggle button
            $('#theme-toggle').click(function(e) {
                e.preventDefault();
                toggleTheme();
            });

            // Event handler for new connections.
            // The callback function is invoked when a connection with the
            // server is established.
            socket.on('connect', function() {
                socket.emit('my_event', {data: 'I\'m connected!'});
                $('#log').append('<br>Socket connected');
            });

            // Handle disconnection
            socket.on('disconnect', function() {
                $('#log').append('<br><span style="color:red;">Socket disconnected - attempting to reconnect...</span>');
            });

            // Handle reconnection
            socket.on('reconnect', function() {
                $('#log').append('<br><span style="color:green;">Socket reconnected! Rejoining room...</span>');
                // Rejoin the room after reconnection
                var username = getCookie("username");
                var room = getCookie("room");
                if (room && username) {
                    socket.emit('name_join', {username: username, room: room});
                    // ask server for current room state after rejoining
                    setTimeout(function() {
                        socket.emit('resync_request', {username: username, room: room});
                    }, 250);
                }
            });

            // Handle resync response from server when reconnecting
            socket.on('resync_response', function(msg, cb) {
                try {
                    var running = msg.running;
                    if (!running) return;

                    var question = msg.current_question;
                    var answers = msg.current_answers || [];
                    var time_remaining = msg.time_remaining || 0;

                    if (question) {
                        // Rebuild question UI similar to my_question
                        que = "<div id='question'> <h2 class='question_h2'>" + question + "</h2> </div>";
                        ans = "<form id='ans' method='POST' action='#'>";
                        for (let i = 0; i < answers.length; i++) {
                            var short_id_name = answers[i].replace(/[^A-Z0-9]/ig, "");
                            ans += "<input type='button' class='ans' id='ans_" + short_id_name + "' value='" + answers[i] + "' name='" + answers[i] + "' > <br>";
                        }
                        ans += "</form>";

                        $('#question_zone').html(que);
                        $('#answer_zone').html(ans);
                    }

                    // Update leaderboard if present
                    if (msg.leaderboard) {
                        var text = "";
                        for (const [key, value] of Object.entries(msg.leaderboard)) {
                            text += "<b>" + key + "</b> : " + value + "<br>";
                        }
                        text += "<br>";
                        $('#room_leaderboard').html(text);
                    }

                    // Update countdown bar if we have duration
                    if (time_remaining && msg.last_quiz_duration) {
                        var percentage_left = time_remaining / msg.last_quiz_duration * 100;
                        percentage_left = 100 + (percentage_left * -1);
                        text = '<div class="loading-bar-bg">';
                        text += '<div class="loading-bar-bar" style="height:24px;width:' + percentage_left +'%"></div>';
                        text += '</div>';
                        $('#room_stats').html(text);
                    }
                } catch (e) {
                    console.error('Error handling resync_response', e, msg);
                }
                if (cb) cb();
            });

            // Handle user being designated as host
            socket.on('host_status', function(msg, cb) {
                console.log('Received host_status event:', msg);
                isHost = msg.is_host;
                $('#player_role').text(isHost ? '👑 Host' : '🎮 Player');
                $('#player_role').css('background', isHost ? 'var(--primary)' : 'var(--accent)');
                if (isHost) {
                    $('#host_controls').show();
                    console.log('Showing host controls');
                } else {
                    $('#host_controls').hide();
                    console.log('Hiding host controls');
                }
                if (cb) cb();
            });

            // When the server reassigns the host, update UI for everyone.
            socket.on('host_changed', function(msg, cb) {
                console.log('Host changed event:', msg);
                var newHost = msg.username || null;
                var myName = $('#username').val() || getCookie('username');

                if (!newHost) {
                    // No host currently
                    isHost = false;
                    $('#player_role').text('🎮 Player');
                    $('#player_role').css('background', 'var(--accent)');
                    $('#host_controls').hide();
                } else if (newHost === myName) {
                    // This client became the host
                    isHost = true;
                    $('#player_role').text('👑 Host');
                    $('#player_role').css('background', 'var(--primary)');
                    $('#host_controls').show();
                    console.log('You are now the host');
                } else {
                    // Another user is host
                    isHost = false;
                    $('#player_role').text('🎮 Player — Host: ' + newHost);
                    $('#player_role').css('background', 'var(--accent)');
                    $('#host_controls').hide();
                }

                if (cb) cb();
            });

            socket.on('room_player_update', function(msg, cb) {
                $('#player_count').text(msg.player_count || 0);
                if (cb) cb();
            });

            // Event handler for server sent data.
            // The callback function is invoked whenever the server emits data
            // to the client. The data is then displayed in the "Received"
            // section of the page.
            socket.on('my_response', function(msg, cb) {
                $('#log').append('<br>' + $('<div/>').text('Received #' + msg.count + ': ' + msg.data).html());
                if (cb)
                    cb();
            });

            socket.on('my_start', function(msg, cb) {
                d = JSON.parse(msg.data);

                // Hide join and room info screens
                $("#join_screen").hide();
                $("#room_info_screen").hide();
                
                // Show questions and leaderboard for gameplay
                $("#questions").show();
                $("#leaderboard_handler").show();

                if(d[0] == "popup"){
                    $("#game_splash_screen").show();
                }
                else if(d[0] == "start"){
                    $("#game_splash_screen").hide();
                }
                $("#menu").hide();
            });

            // Question handler
            socket.on('my_question', function(msg, cb) {
                q = JSON.parse(msg.data);

                que = "<div id='question'> <h2 class='question_h2'>" + q[2] + "</h2> </div>";
                // ans = "<div id='question'> Question : " + q[2] + "</div>";
                ans = "<form id='ans' method='POST' action='#'>";
                for (let i = 0; i < q[3].length; i++) {
                    var short_id_name = q[3][i].replace(/[^A-Z0-9]/ig, "");
                    ans += "<input type='button' class='ans' id='ans_" + short_id_name + "' value='" + q[3][i] + "' name='" + q[3][i] + "' > <br>";
                }
                ans += "</form>";

                $('#question_zone').html(que);
                $('#answer_zone').html(ans);

                // Handle answer buttons, emit the answer to the room
                $('input:button').click(function(event) {
                    var btnValue = $(this).val();
                    var element = this; // adding the current object in a variable

                    // Send Answer
                    socket.emit('my_answer', {room: $('#join_room').val(),
                                            username: $('#username').val(), 
                                            answer: btnValue });

                    // Remove any other selected answers, in case they be doing that.
                    var all_ans_seletected = document.getElementsByClassName('ans_selected');

                    for (var i = 0; i < all_ans_seletected.length; i++) {
                        all_ans_seletected[0].classList.add("ans");
                        all_ans_seletected[0].classList.remove("ans_selected");
                    }

                    $(element).removeClass("ans").addClass("ans_selected");

                    return false;
                });

                if (cb)
                    cb();
            });

            // Question answers handler
            socket.on('my_question_answer', function(msg, cb) {

                msg_json = JSON.parse(msg.data);

                var short_id_name = msg_json[1].replace(/[^A-Z0-9]/ig, "");
                var element = document.getElementById("ans_" +short_id_name);
                console.log(short_id_name);
                $(element).addClass("ans_correct");

            });

            // Question handler
            socket.on('my_liar_question', function(msg, cb) {
                q = JSON.parse(msg.data);

                que = "<div id='question'> <h3 class='question_h2'>" + q[2] + "</h3> </div>";
                // ans = "<div id='question'> Question : " + q[2] + "</div>";
                ans = "<form id='liar_ans' method='POST' action='#'>";
                ans += "<input type='text' class='lie_input' id='user_lie' placeholder='Write your fake answer here!' name='user_lie' >";
                ans += "<input class='menu_submit' id='lie_submit' type='submit' value='Submit Lie'>"
                ans += "</form>";

                $('#question_zone').html(que);
                $('#answer_zone').html(ans);

                // Handle answer buttons, emit the answer to the room
                $('form#liar_ans').submit(function(event) {
                    var btnValue = $("#user_lie").val();

                    // Send Answer
                    socket.emit('my_liar_answer', {room: $('#join_room').val(),
                                            username: $('#username').val(), 
                                            answer: btnValue });
                    // Disable submit:
                    $('#lie_submit').attr("disabled", true);
                    $('#user_lie').attr("disabled", true);

                    return false;
                });

                if (cb)
                    cb();
            });

            // Leaderboard handler
            socket.on('my_leaderboard', function(msg, cb) {

                msg_json = JSON.parse(msg.data);
                console.log(msg_json);

                // Build a table with name | current score | games won
                var table = '<table style="width: 100%; border-collapse: collapse;">';
                table += '<tr style="background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); color: white; font-weight: 900;"><th style="padding: 0.75rem; text-align: left; border: 2px solid var(--primary);">Player</th><th style="padding: 0.75rem; text-align: center; border: 2px solid var(--primary);">Round Score</th><th style="padding: 0.75rem; text-align: center; border: 2px solid var(--primary);">Games Won</th></tr>';
                
                for (const [name, scores] of Object.entries(msg_json)) {
                    var roundScore = scores.points || 0;
                    var gamesWon = scores.games_won || 0;
                    table += '<tr style="border: 1px solid var(--border);"><td style="padding: 0.75rem; border-right: 1px solid var(--border); font-weight: 600;">' + name + '</td><td style="padding: 0.75rem; text-align: center; border-right: 1px solid var(--border);">' + roundScore + '</td><td style="padding: 0.75rem; text-align: center;">' + gamesWon + '</td></tr>';
                }
                table += '</table>';
                
                $('#room_leaderboard').html(table);

            });

            // Game end handler - display final leaderboard with medals
            socket.on('game_end', function(msg, cb) {
                var final_leaderboard = JSON.parse(msg.data);
                
                // Sort leaderboard by points (highest first)
                var sorted = Object.entries(final_leaderboard)
                    .sort((a, b) => b[1].points - a[1].points);
                
                var html = '<div id="end_screen_container" class="end_screen_container">';
                html += '<h2 class="end_screen_title">Final Results</h2>';
                
                sorted.forEach(function(entry, index) {
                    var name = entry[0];
                    var score = entry[1].points || 0;
                    var gamesWon = entry[1].games_won || 0;
                    var medal = '';
                    var rank_class = '';
                    
                    if (index === 0) {
                        medal = '🥇';
                        rank_class = 'rank_1';
                    } else if (index === 1) {
                        medal = '🥈';
                        rank_class = 'rank_2';
                    } else if (index === 2) {
                        medal = '🥉';
                        rank_class = 'rank_3';
                    } else {
                        rank_class = 'rank_other';
                    }
                    
                    html += '<div class="leaderboard_entry ' + rank_class + '">';
                    if (medal) html += '<span class="medal">' + medal + '</span>';
                    html += '<span class="player_name">' + name + '</span>';
                    html += '<span class="player_score">' + score + ' pts | ' + gamesWon + ' wins</span>';
                    html += '</div>';
                });
                
                html += '</div>';
                
                // Hide the questions and show the end screen
                $('#questions').hide();
                $('#game_end_screen').html(html).show();
                
                if (cb) cb();
            });

            // Countdown handler
            socket.on('my_countdown', function(msg, cb) {

                msg_json = JSON.parse(msg.data);

                //text = "Time Left: " + msg_json[1] + " seconds <br>";
                percentage_left = msg_json[1] / msg_json[2] * 100;
                // Make it go left to right, rather than right to left:
                percentage_left = 100 + (percentage_left*-1)

                text = '<div class="loading-bar-bg">';
                text += '<div class="loading-bar-bar" style="height:24px;width:' + percentage_left +'%"></div>';
                text += '</div>';

                $('#room_stats').html(text);
            });

            // Reset UI when new game starts
            socket.on('my_start', function(msg, cb) {
                d = JSON.parse(msg.data);
                $('#join_screen').hide();
                $('#room_info_screen').hide();
                $('#leaderboard_handler').show();
                $('#game_end_screen').hide();
                $('#questions').show();
                if(d[0] == "popup"){
                    $("#game_splash_screen").show();
                }
                else if(d[0] == "start"){
                    $("#game_splash_screen").hide();
                }
            });

            // Handle game start error (already in progress)
            socket.on('game_start_error', function(msg, cb) {
                var error_msg = JSON.parse(msg.data);
                alert('Cannot start game: ' + error_msg);
                if (cb) cb();
            });
            // message. The server then responds with a "pong" message and the
            // round trip time is measured.
            var ping_pong_times = [];
            var start_time;
            var ping_interval = window.setInterval(function() {
                if (socket.connected) {
                    start_time = (new Date).getTime();
                    $('#transport').text(socket.io.engine.transport.name);
                    socket.emit('my_ping');
                }
            }, 1000);

            // Handler for the "pong" message. When the pong is received, the
            // time from the ping is stored, and the average of the last 30
            // samples is average and displayed.
            socket.on('my_pong', function() {
                var latency = (new Date).getTime() - start_time;
                ping_pong_times.push(latency);
                ping_pong_times = ping_pong_times.slice(-30); // keep last 30 samples
                var sum = 0;
                for (var i = 0; i < ping_pong_times.length; i++)
                    sum += ping_pong_times[i];
                $('#ping-pong').text(Math.round(10 * sum / ping_pong_times.length) / 10);
            });

            // Handlers for the different forms in the page.
            // These accept data from the user and send it to the server in a
            // variety of ways
            $('form#emit').submit(function(event) {
                socket.emit('my_event', {data: $('#emit_data').val()});
                return false;
            });
            $('form#broadcast').submit(function(event) {
                socket.emit('my_broadcast_event', {data: $('#broadcast_data').val()});
                return false;
            });
            // $('form#join').submit(function(event) {
            //     socket.emit('join', {room: $('#join_room').val()});
            //     return false;
            // });
            $('form#name_join').submit(function(event) {
                var username_input = $('#username').val();
                var room_input = $('#join_room').val();
                socket.emit('name_join', {username: username_input, room: room_input});
                setCookie("username", username_input, 7);
                setCookie("room", room_input, 7);
                
                // Show room info, hide join screen
                $('#join_screen').hide();
                $('#room_info_screen').show();
                $('#leaderboard_handler').show();
                $('#current_room').text(room_input);
                return false;
            });
            // Handle start room with advanced options (buttons are simple inputs,
            // so listen for clicks rather than submit events on a form).
            $('#host_controls').on('click', 'input[type=submit]', function(event) {
                event.preventDefault();
                var gameType = $(this).attr('name');
                socket.emit('start_room', {
                    room: $('#current_room').text(),
                    numofq: $('#question_num').val(),
                    category: $('#category').val(),
                    gametype: gameType,
                    quiz_timer: parseInt($('#quiz_timer').val()) || 15,
                    answer_timer: parseInt($('#answer_timer').val()) || 3,
                    liar_submit_timer: parseInt($('#liar_submit_timer').val()) || 10
                });
                return false;
            });
            $('form#leave').submit(function(event) {
                socket.emit('leave', {room: $('#leave_room').val()});
                return false;
            });
            $('form#send_room').submit(function(event) {
                socket.emit('my_room_event', {room: $('#room_name').val(), data: $('#room_data').val()});
                return false;
            });
            $('form#close').submit(function(event) {
                socket.emit('close_room', {room: $('#close_room').val()});
                return false;
            });
            $('form#disconnect').submit(function(event) {
                socket.emit('disconnect_request');
                return false;
            });
            
            // Change room handler
            $('form#change_room').submit(function(event) {
                // Reset to join screen
                $('#join_screen').show();
                $('#room_info_screen').hide();
                $('#leaderboard_handler').hide();
                $('#username').val('');
                $('#join_room').val('');
                eraseCookie('username');
                eraseCookie('room');
                return false;
            });
        });
    </script>
</head>
<body>
    <div class="wrap_all">
        <div class="content">
            <!-- Header with title and theme toggle -->
            <div class="header">
                <h1>🎯 Trivia</h1>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode"></button>
                </div>
            </div>
            
            <div id="top_row">
                <!-- Join Room Screen (shown first) -->
                <div id="join_screen" class="menubar" style="grid-column: 1; grid-row: 1;">
                    <h3 class="menu_h3">🎮 Join the Game</h3>
                    <form id="name_join" method="POST" action='#'>
                        <label for="username"><strong>Your Player Name</strong></label>
                        <input type="text" name="username" id="username" placeholder="Enter your awesome name" required maxlength="20">
                        
                        <label for="join_room" style="margin-top: 1rem;"><strong>Room Code</strong></label>
                        <input type="text" name="join_room" id="join_room" placeholder="Enter room code" required maxlength="30">
                        
                        <input class="menu_submit" type="submit" value="🚀 Join Room">
                    </form>
                </div>

                <!-- Room Status & Host Controls (shown after joining) -->
                <div id="room_info_screen" class="menubar" style="display: none; grid-column: 1; grid-row: 1;">
                    <h3 class="menu_h3">📍 Room Status</h3>
                    <div style="margin-bottom: 1.5rem;">
                        <p><strong>Room Code:</strong> <span id="current_room" style="background: var(--secondary); padding: 0.5rem; border: 2px solid var(--text-primary); font-weight: 900;">--</span></p>
                        <p><strong>Players:</strong> <span id="player_count">0</span></p>
                        <p><strong>Your Role:</strong> <span id="player_role" style="background: var(--accent); padding: 0.25rem 0.75rem; border-radius: 20px; font-weight: 900;">Player</span></p>
                    </div>
                    
                    <!-- Host Controls (only visible to host) -->
                    <div id="host_controls" style="display: none; border-top: 3px dashed var(--border); padding-top: 1.5rem;">
                        <h4 style="color: var(--primary); font-weight: 900;">⚙️ Game Settings</h4>
                        
                        <label for="category"><strong>Category</strong></label>
                        <select id="category" name="category">
                            <option value="0">🌍 Any Category</option>
                            <option value="9">🧠 General Knowledge</option>
                            <option value="11">🎬 Film</option>
                            <option value="22">🗺️ Geography</option>
                            <option value="23">📜 History</option>
                            <option value="12">🎵 Music</option>
                            <option value="20">🏛️ Mythology</option>
                            <option value="17">🔬 Science & Nature</option>
                            <option value="21">⚽ Sports</option>
                            <option value="14">📺 TV</option>
                            <option value="15">🎮 Video Games</option>
                        </select>

                        <label for="question_num" style="margin-top: 1rem;"><strong>Number of Questions</strong></label>
                        <input type="number" name="question_num" id="question_num" placeholder="5" value="5" min="1" max="50" required>
                        
                        <!-- Advanced Options Collapsible -->
                        <details style="margin-top: 1.5rem; border: 2px solid var(--accent); padding: 1rem; border-radius: 8px;">
                            <summary style="cursor: pointer; font-weight: 900; color: var(--accent); margin: -1rem -1rem 0 -1rem; padding: 1rem;">
                                ⚡ Advanced Options
                            </summary>
                            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--accent);">
                                <label for="quiz_timer"><strong>Seconds Per Question</strong></label>
                                <input type="number" name="quiz_timer" id="quiz_timer" value="15" min="5" max="60">
                                
                                <label for="answer_timer" style="margin-top: 1rem;"><strong>Seconds to Show Answer</strong></label>
                                <input type="number" name="answer_timer" id="answer_timer" value="3" min="1" max="10">
                                
                                <label for="liar_submit_timer" style="margin-top: 1rem;"><strong>Seconds to Submit Lie (Liar Mode)</strong></label>
                                <input type="number" name="liar_submit_timer" id="liar_submit_timer" value="10" min="3" max="30">
                            </div>
                        </details>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.5rem;">
                            <input class="menu_submit" type="submit" name="quiz" value="📝 Start Quiz" style="background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%); color: var(--text-primary); margin: 0;">
                            <input class="menu_submit secondary" type="submit" name="liar" value="🤥 Start Liar" style="margin: 0;">
                        </div>
                    </div>
                    
                    <form id="change_room" style="margin-top: 1rem;">
                        <input class="menu_submit" type="submit" value="🔄 Change Room" style="margin: 0;">
                    </form>
                </div>

                <!-- Leaderboard Panel -->
                <div id="leaderboard_handler" style="display: none; grid-column: 1; grid-row: 2;">
                    <h3 class="leaderboard_h3">🏆 Leaderboard</h3>
                    <div id="room_leaderboard"></div>
                </div>

            <!-- Questions Panel -->
            <div id="questions" class="main_zone" style="display: none;">
                <h3 class="question_h3">❓ Question</h3>
                <div id="question_zone"></div>
                <div id="room_stats"></div>
                <h3 class="answer_h3">✅ Answer</h3>
                <div id="answer_zone"></div>
            </div>

            <!-- Game End Screen -->
            <div id="game_end_screen" class="main_zone" style="display: none;">
            </div>
        </div>
    </div>
